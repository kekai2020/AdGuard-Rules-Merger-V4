# AdGuard Rules Merger V4 — Source configuration
# Each source is a HostlistsRegistry filter_N.txt (or any DNS-format list).
# Updated: 2026-09-22 — 18 lists, Windows full-memory profile

# ── Global merge settings ──────────────────────────────────────────
timeout: 60
max_concurrency: 50

# ── Download settings ─────────────────────────────────────────────
download:
  user_agent: "AdGuard-Rules-Merger/4.0"
  retry_count: 2
  retry_delay: 1.5

# ── Dedup settings ──────────────────────────────────────────────────
dedup:
  strip_www: true              # Treat www.example.com == example.com
  normalize_case: true         # Always lowercase (already default)
  normalize_trailing_dot: true # Strip trailing FQDN dot

# ── Quality filter settings ─────────────────────────────────────────
quality_filter:
  enabled: true
  min_domain_length: 4
  max_domain_length: 253
  filter_localhost: true
  filter_ip_rules: false

# ── Aggregation settings ────────────────────────────────────────────
aggregation:
  enabled: true
  min_aggregator_labels: 2

# ── Conflict resolution settings ────────────────────────────────────
conflict_resolution:
  enabled: true
  cascade_subdomains: true

# ── Cache settings (ETag + SHA256, compatible with actions/cache) ──
cache:
  enabled: true
  directory: cache
  ttl_seconds: 0            # 0 = no time-based expiry
  max_size_mb: 500

# ── Output settings ────────────────────────────────────────────────
output:
  directory: output
  formats:
    - adguard
    - whitelist
    - hosts
    - domains
    - clash
    - surge
    - smartdns
  tiered: true
  report: true

